services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: invenpilot
      MYSQL_USER: invenpilot
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in the root .env}
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_PASSWORD\" mysql -h 127.0.0.1 -u \"$$MYSQL_USER\" \"$$MYSQL_DATABASE\" -e 'SELECT 1' >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 20s

  app:
    profiles: ["app"]
    build: .
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      APP_NAME: InvenPilot
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY:-}
      APP_URL: ${APP_URL:-http://localhost:8080}
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: invenpilot
      DB_USERNAME: invenpilot
      DB_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in the root .env}
      SANCTUM_STATEFUL_DOMAINS: ${SANCTUM_STATEFUL_DOMAINS:-localhost:8080,127.0.0.1:8080}
      SESSION_DRIVER: database
      SESSION_ENCRYPT: "true"
      SESSION_SECURE_COOKIE: ${SESSION_SECURE_COOKIE:-false}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      LOG_CHANNEL: stderr
      MAIL_MAILER: ${MAIL_MAILER:-array}
      MAIL_HOST: ${MAIL_HOST:-127.0.0.1}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_SCHEME: ${MAIL_SCHEME:-smtp}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-inventory@example.com}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-InvenPilot}
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:80"
    volumes:
      - app-storage:/var/www/html/storage
    healthcheck:
      test: ["CMD", "php", "-r", "exit(file_get_contents('http://127.0.0.1/api/v1/health') === false ? 1 : 0);"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mysql-data:
  app-storage:
